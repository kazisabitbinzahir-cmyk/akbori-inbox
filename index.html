<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Akbori Inbox</title>
<link rel="stylesheet" href="css/inbox.css">
</head>
<body>
<div class="topbar">
  <h1>🛍️ Akbori Inbox</h1>
  <div class="tcontrols">
    <div class="gtog"><span>AI</span><label class="ttrack"><input type="checkbox" id="gai" checked onchange="toggleGAI(this.checked)"><div class="tbg" id="gaibg" style="background:#4caf50"></div><div class="tknob" id="gaiknob"></div></label><span id="gailbl" style="font-weight:700">ON</span></div>
    <div class="gtog"><span>Global ID</span><label class="ttrack"><input type="checkbox" id="gid" onchange="toggleGID(this.checked)"><div class="tbg" id="gidbg" style="background:#ccc"></div><div class="tknob" id="gidknob"></div></label><span id="gidlbl" style="font-weight:700">OFF</span></div>
    <div class="gtog"><span>Auto</span><label class="ttrack"><input type="checkbox" id="gauto" checked onchange="toggleGAuto(this.checked)"><div class="tbg" id="gautobg" style="background:#4caf50"></div><div class="tknob" id="gautoknob"></div></label><span id="gautolbl" style="font-weight:700">ON</span></div>
    <button class="rbtn" id="rfbtn" onclick="manualRefresh()">🔄 Refresh</button>
    <button class="bbtn" id="bbtn" onclick="openBulk()">📢 Bulk</button>
    <span class="stats" id="stats">-</span>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="ftbar" id="ftbar" onclick="toggleFP()"><span>🔍 Search & Filters</span><span id="fticon">▼</span></div>
    <div class="fpanel" id="fpanel">
      <div class="sbar"><input type="text" id="sinput" placeholder="Search keywords, ID..." oninput="applyFilters()"></div>
      <div class="frow" id="pfrow"><button class="fbtn active" onclick="setPF('all',this)">সব</button></div>
      <div class="frow" id="tfrow"><button class="fbtn active" onclick="setTF('all',this)">সব Tag</button></div>
      <div class="sfrow">
        <button class="sfbtn active" onclick="setSF('all',this)">সব</button>
        <button class="sfbtn" onclick="setSF('unread',this)">Unread</button>
        <button class="sfbtn" onclick="setSF('unanswered',this)">Unanswered</button>
        <button class="sfbtn" onclick="setSF('read',this)">Read</button>
        <button class="sfbtn" onclick="setSF('noted',this)">📝 Note</button>
        <button class="sfbtn" onclick="setSF('noimage',this)">🚫📷</button>
      </div>
      <div class="dfrow"><input type="date" id="dfrom" onchange="applyFilters()"><input type="date" id="dto" onchange="applyFilters()"></div>
      <div class="sortrow"><span>Sort:</span><button class="sfbtn active" id="sasc" onclick="setSort('asc',this)">🕐 Old→New</button><button class="sfbtn" id="sdesc" onclick="setSort('desc',this)">🕑 New→Old</button></div>
      <div class="mgrbtns"><button class="mgrbtn" onclick="openTMgr()">⚙️ Tags</button><button class="suggbtn" onclick="openSMgr()">💬 Suggestions</button></div>
    </div>
    <div class="clist" id="clist"></div>
  </div>

  <div class="chat-area" id="chatarea">
    <div class="estate" id="estate"><div style="font-size:48px">💬</div><p>Conversation select করুন</p></div>
    <div id="chatview" style="display:none;flex-direction:column;height:100%;overflow:hidden">
      <div class="chdr">
        <button class="backbtn" onclick="goBack()">←</button>
        <div class="av" id="chav" style="background:#1877f2">?</div>
        <div class="chinfo">
          <h3 id="chname">-</h3>
          <p id="chmeta">-</p>
          <div class="chattagbar" id="chattagbar"></div>
        </div>
        <div class="chacts">
          <div class="twrap">
            <input type="text" class="tinput" id="tinput" placeholder="Tag..." oninput="showTS()" onkeydown="tagKD(event)">
            <div class="tsugg" id="tsugg"></div>
            <button class="taddbt" onclick="addTag()">+</button>
          </div>
          <button class="notebtn" onclick="openNote()">📝</button>
          <div class="htogwrap"><span>Human</span><label class="ttrack"><input type="checkbox" id="htog" onchange="toggleHuman()"><div class="tbg" id="htbg" style="background:#ccc"></div><div class="tknob" id="htknob"></div></label></div>
          <div class="idtogwrap"><span>ID</span><label class="ttrack"><input type="checkbox" id="idtog" onchange="onIDToggle()"><div class="tbg" id="idtbg" style="background:#ccc"></div><div class="tknob" id="idtknob"></div></label></div>
        </div>
      </div>
      <div class="msgarea" id="msgarea"></div>
      <div class="suggbar" id="suggbar"></div>
      <div class="replyarea">
        <div class="rtabs"><button class="rtab active" id="ttab" onclick="setMode('text')">✏️ Text</button><button class="rtab" id="itab" onclick="setMode('image')">🖼️ Image</button></div>
        <div class="rbox">
          <textarea class="rinput" id="rinput" placeholder="Reply লিখুন... (Enter to send)"></textarea>
          <div class="imgarea" id="imgarea" onclick="document.getElementById('fiinput').click()">
            📷 ছবি select করুন<br><span style="font-size:10px">বা drag & drop</span>
            <img id="iprev" class="iprev" style="display:none">
            <input type="file" id="fiinput" accept="image/*" style="display:none" onchange="handleFile(event)">
          </div>
          <button class="sbtn" id="sendbtn" onclick="sendReply()">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="lbox" id="lbox" onclick="closeLB()"><button class="lclose" onclick="closeLB()">✕</button><img id="limg" src="" alt=""></div>

<div class="modal" id="notemodal"><div class="mbox" onclick="event.stopPropagation()">
  <h4>📝 Note</h4>
  <textarea class="nta" id="nota" placeholder="Note লিখুন..."></textarea>
  <div class="nacts"><button class="ncancel" onclick="closeNote()">Cancel</button><button class="nsave" onclick="saveNote()">Save</button></div>
</div></div>

<div class="modal" id="bulkmodal"><div class="mbox" onclick="event.stopPropagation()">
  <h4>📢 Bulk Message</h4>
  <p class="binfo" id="binfo">0 জন</p>
  <textarea class="bta" id="bta" placeholder="Message লিখুন..."></textarea>
  <div class="bacts"><button class="bcancel" onclick="closeBulk()">Cancel</button><button class="bsend" onclick="sendBulk()">Send All</button></div>
</div></div>

<div class="modal" id="tmgrmodal"><div class="mbox" onclick="event.stopPropagation()">
  <h4>⚙️ Tag Manager</h4>
  <div class="tmgrnew"><input type="text" id="tmgrin" placeholder="নতুন tag..." onkeydown="if(event.key==='Enter')addGTag()"><button onclick="addGTag()">+ Add</button></div>
  <div class="tnote" id="tnote">সব conversations</div>
  <div class="mscroll" id="tmgrlist"></div>
  <button class="mclose" onclick="closeTMgr()">Close</button>
</div></div>

<div class="modal" id="smgrmodal"><div class="mbox smbox" onclick="event.stopPropagation()">
  <h4>💬 Suggestion Manager</h4>
  <div class="smgrform">
    <div class="smgrrow">
      <input type="text" id="smgrkw" placeholder="Keywords (comma separated)">
      <select id="smgrcond"><option value="any">Any message</option><option value="has_image">Has image</option><option value="no_image">No image</option><option value="kw_only">Keywords only</option></select>
      <label style="display:flex;align-items:center;gap:3px;font-size:10px;white-space:nowrap"><input type="checkbox" id="smgrauto"> Auto Send</label>
    </div>
    <div class="smgrrow">
      <textarea id="smgrtext" placeholder="Suggestion text..."></textarea>
      <button class="smgradd" id="smgradd" onclick="addSugg()">+ Add</button>
    </div>
  </div>
  <div class="mscroll" id="smgrlist"></div>
  <button class="mclose" onclick="closeSMgr()">Close</button>
</div></div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/filters.js"></script>
<script src="js/render.js"></script>
<script src="js/toggles.js"></script>
<script src="js/send.js"></script>
<script src="js/modals.js"></script>
<script src="js/tags.js"></script>
<script src="js/suggestions.js"></script>
<script src="js/init.js"></script>
</body>
</html>
